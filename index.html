<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script defer src="script.js"></script>
</head>
<body>
    <header class="head">
        <h1 class="title">library</h1>
        <button class="login">Log in</button>
    </header>
    <main class="main-content">
        <button id="add-book" class="add">+ Add book</button>
        <dialog id="book-dialog">
            <form id="book-form" method="dialog">
                <h2>Add a New Book</h2>

                <input 
                    type="text" 
                    class="input" 
                    id="title" 
                    name="title"
                    placeholder="Title" 
                    required 
                    max="100" 
                >
                <input 
                    type="text" 
                    class="input" 
                    id="author" 
                    name="author" 
                    placeholder="Author" 
                    required 
                    max="100"
                >
                <input 
                    type="number" 
                    class="input" 
                    id="pages" 
                    name="pages" 
                    placeholder="Pages" 
                    required 
                    min="0"
                    max="10000"
                >
                <div class="field">
                    <label for="read">Have you read it?</label>
                    <input type="checkbox" id="read" name="read">
                </div>

                <div class="form-buttons">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </dialog>
        <div id="library" class="library">
            <div class="book-grid"></div>
        </div>
    </main>
    <footer class="footer">
        <p>
            Copyright ©
            <script>
                document.write(new Date().getFullYear());
            </script>
            justwin02
        </p>
        <a href="https://github.com/justwin02" target="_blank" rel="noopener noreferrer">
            <img src="./assets/img/github-mark.svg" alt="GitHub — justwin02" class="github-logo">
        </a>
    </footer>
</body>
</html>
